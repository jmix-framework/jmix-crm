com.company.crm.ai.view.conversation/promptSuggestion.1.title=Клијенти са највећим ризиком
com.company.crm.ai.view.conversation/promptSuggestion.1.prompt=Проверите Connelly LLC, Kulas-Luettgen, King-Adams, Zulauf, Kihn and Lakin и Strosin Inc на сигнале ризика на основу отворених фактура, доспелих уплата или необичне недавне активности. Користите доступне CRM податке, извршите JPQL упите ако је потребно и кратко објасните којих пет клијената је тренутно најкритичније и зашто.
com.company.crm.ai.view.conversation/promptSuggestion.2.title=Најважније доспеле фактуре
com.company.crm.ai.view.conversation/promptSuggestion.2.prompt=Прикажите ми пет најважнијих доспелих фактура са клијентом, износом, датумом доспећа и статусом. Поређајте их по пословном ризику и објасните које случајеве треба прво да прегледам.
com.company.crm.ai.view.conversation/promptSuggestion.3.title=Приоритети продајног процеса
com.company.crm.ai.view.conversation/promptSuggestion.3.prompt=Анализирајте тренутни продајни процес и реците ми који послови сада захтевају највише пажње. Узмите у обзир обим, статус и могуће сигнале ризика и претворите резултат у кратак менаџерски резиме.
com.company.crm.ai.view.conversation/promptSuggestion.4.title=Преглед Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.4.prompt=Направите компактни преглед клијента Connelly LLC из свих углова за припрему састанка са клијентом. Сажмите приход, отворене фактуре, понашање при плаћању, недавне активности и видљиве ризике у јасан менаџерски брифинг.
com.company.crm.ai.view.conversation/promptSuggestion.5.title=Преглед поруџбина Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.5.prompt=Прикажите ми највредније или најнеобичније поруџбине за клијента Connelly LLC и објасните зашто су важне из пословне перспективе. Користите доступне податке и истакните отворена питања, ризике или активности за праћење.
com.company.crm.ai.view.conversation/promptSuggestion.6.title=Ланац фактуре Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.6.prompt=Објасните на једном конкретном примеру за клијента Connelly LLC како су фактура, поруџбина, уплата и клијент повезани у пословном току. Ако је релевантно више записа, претворите их у једну јасну пословну причу са кључним ID-јевима или називима.
com.company.crm.ai.view.conversation/promptSuggestion.7.title=Анализа образаца плаћања
com.company.crm.ai.view.conversation/promptSuggestion.7.prompt=Проверите да ли тренутно постоје необични обрасци плаћања, опомена или кашњења. Прикажите конкретне примере и изведите закључак где финансије или менаџери налога треба да реагују.
com.company.crm.ai.view.conversation/promptSuggestion.8.title=Представи производ
com.company.crm.ai.view.conversation/promptSuggestion.8.prompt=Направите кратак и убедљив продајни резиме за један изабрани производ пословним језиком. Опишите вредност, вероватне случајеве употребе и шта продавац треба да нагласи у разговору.
com.company.crm.ai.view.conversation/promptSuggestion.9.title=Следећи кораци за Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.9.prompt=Изведите најкорисније следеће кораке за продају и финансије за клијента Connelly LLC из тренутних CRM података. Дајте ми приоритетну листу са кратким образложењем како бих могао одмах да поступим.
com.company.crm.ai.view.conversation/promptSuggestion.10.title=Извештај о ризику новчаног тока
com.company.crm.ai.view.conversation/promptSuggestion.10.prompt=Анализирајте новчани ток и расподелу ризика по доступним категоријама производа или услуга и објасните најважније налазе. Истакните категорије са високим ризиком или необичном расподелом и наведите које активности треба да уследе.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.singular=овог клијента
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.plural=ове клијенте
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.title=Провера стања клијента
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.prompt=Анализирајте %s користећи CRM контекст. Сажмите приход, отворене фактуре, понашање при плаћању, недавне поруџбине, видљиве ризике и следеће активности за управљање налогом.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.title=Ризик плаћања
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.prompt=Прегледајте ризик плаћања и фактура за %s. Истакните доспеле износе, неплаћена салда, необично понашање при плаћању и које финансијске активности треба прво спровести.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.title=Спремност поруџбина
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.prompt=Прегледајте ситуацију са поруџбинама за %s. Идентификујте важне поруџбине, отворене ризике испоруке или испуњења, повезане фактуре и препоручене оперативне активности.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.title=Брифинг за састанак
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.prompt=Направите сажет брифинг за састанак за %s. Укључите пословни однос, недавну активност, финансијски статус, вероватне теме разговора и конкретне следеће кораке.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.singular=ову поруџбину
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.plural=ове поруџбине
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.title=Преглед статуса поруџбине
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.prompt=Прегледајте %s у контексту. Сажмите статус, укупну вредност, кључне ставке, утицај на клијента и ризике или блокаде којима треба посветити пажњу.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.title=Утицај на фактуре
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.prompt=Проверите како се %s повезује са фактурама и уплатама. Објасните шта је фактурисано, шта је остало отворено и да ли финансије треба да реагују.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.title=Праћење са клијентом
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.prompt=Припремите резиме за праћење са клијентом за %s. Укључите тренутни статус, важне ставке, отворена питања и најбољу следећу активност.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.title=Микс производа
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.prompt=Анализирајте микс производа или категорија у %s. Истакните најважније ставке, необичне количине или вредности и продајне прилике.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.singular=ову фактуру
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.plural=ове фактуре
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.title=Преглед фактуре
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.prompt=Прегледајте %s и сажмите статус, датум доспећа, укупан износ, повезану поруџбину, примљене уплате и преостали салдо.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.title=Ризик наплате
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.prompt=Процените ризик наплате за %s. Истакните доспеле или неплаћене износе, вероватне узроке и коју активност треба прво спровести.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.title=Пословни ланац
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.prompt=Објасните пословни ланац око %s: клијент, поруџбина, фактура, уплате и сва отворена оперативна или финансијска питања.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.title=Финансијски план активности
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.prompt=Направите приоритетни финансијски план активности за %s. Укључите шта треба проверити, кога треба контактирати и који исход треба постићи.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.singular=ову уплату
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.plural=ове уплате
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.title=Расподела уплате
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.prompt=Прегледајте %s и објасните којој фактури, поруџбини и клијенту припада. Сажмите износ, датум и евентуални преостали салдо.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.title=Утицај на новчани ток
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.prompt=Анализирајте утицај %s на новчани ток. Објасните шта ова уплата мења у салду клијента и да ли су преостале финансијске активности.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.title=Понашање при плаћању
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.prompt=Користите %s за процену понашања повезаног клијента при плаћању. Истакните правовременост, отворене фактуре, сигнале ризика и следеће активности.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.title=Провера усаглашавања
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.prompt=Проверите да ли %s одговара повезаној фактури и поруџбини. Истакните неслагања, недостајуће податке или потребу за праћењем.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.singular=овај производ
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.plural=ове производе
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.title=Резиме производа
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.prompt=Направите пословни резиме за %s. Објасните шта је то, како се користи у поруџбинама и шта продавац треба да зна.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.title=Продајне прилике
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.prompt=Анализирајте продајне прилике око %s. Идентификујте релевантне клијенте, недавне поруџбине и корисне следеће активности за продају.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.title=Историја поруџбина
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.prompt=Прегледајте историју поруџбина за %s. Истакните важне поруџбине, необичне обрасце потражње и ризике или активности за праћење.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.title=Контекст категорије
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.prompt=Објасните како се %s уклапа у своју категорију и где ствара пословну вредност. Наведите сродне производе или сегменте клијената ако су видљиви.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.singular=ову категорију
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.plural=ове категорије
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.title=Преглед категорије
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.prompt=Анализирајте %s као пословну категорију. Сажмите повезане производе, активност поруџбина, значај за приход и видљиве ризике.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.title=Ризик новчаног тока
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.prompt=Прегледајте сигнале новчаног тока и ризика за %s. Истакните важне производе, клијенте или фактуре који заслужују пажњу.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.title=Фокус продаје
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.prompt=Предложите где продаја треба да се фокусира у оквиру %s. Идентификујте перспективне производе, активне клијенте и следеће активности.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.title=Сређивање портфолија
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.prompt=Проверите %s за недовољно коришћене, необичне или високоризичне производе. Препоручите сређивање, праћење или извештавање.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.singular=овај задатак
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.plural=ове задатке
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.title=Брифинг задатка
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.prompt=Направите сажет брифинг за %s. Сажмите сврху, хитност, повезане CRM записе, контекст власника и очекивану следећу активност.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.title=План активности
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.prompt=Претворите %s у практичан план активности. Наведите следеће кораке, зависности, ризике и шта треба прво урадити.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.title=Блокиран рад
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.prompt=Проверите да ли %s делује блокирано или ризично. Идентификујте недостајуће информације, повезане клијенте или документе и потребе за ескалацијом.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.title=Утицај на клијента
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.prompt=Објасните утицај %s на клијента или пословање. Истакните зашто је важно и како завршетак мења CRM ситуацију.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.singular=овај контакт
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.plural=ове контакте
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.title=Брифинг контакта
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.prompt=Направите CRM брифинг за %s. Сажмите улогу, повезаног клијента, значај комуникације, отворене теме и корисне следеће кораке.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.title=Однос са клијентом
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.prompt=Анализирајте како се %s уклапа у однос са повезаним клијентом. Истакните утицај на одлучивање, недавни контекст, ризике и активности управљања налогом.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.title=Припрема састанка
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.prompt=Припремите разговор са %s. Укључите вероватне теме, релевантне податке о клијенту, отворене фактуре или поруџбине и питања за праћење.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.title=Идеје за праћење
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.prompt=Предложите корисне активности праћења за %s на основу повезаног CRM контекста. Поређајте активности по приоритету за продају, финансије или подршку.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.singular=ову ставку поруџбине
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.plural=ове ставке поруџбине
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.title=Преглед ставке
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.prompt=Прегледајте %s у контексту поруџбине. Објасните производ, количину, вредност, значај за клијента и ризике испуњења или цене.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.title=Потражња за производом
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.prompt=Користите %s за процену потражње за производом и продајног значаја. Наведите повезану категорију, вредност поруџбине и могуће прилике за додатну продају или праћење.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.title=Утицај на поруџбину
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.prompt=Објасните како %s утиче на повезану поруџбину и ситуацију клијента. Истакните зависности, утицај на фактуру и оперативне следеће кораке.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.title=Провера ризика
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.prompt=Проверите %s за необичну количину, цену, производ или сигнале испуњења. Реците ми шта треба проверити пре праћења.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.singular=овај коментар производа
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.plural=ове коментаре производа
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.title=Резиме коментара
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.prompt=Сажмите %s пословним језиком. Објасните повезани производ, контекст пошиљаоца, проблем или сигнал и шта треба да се деси следеће.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.title=Повратне информације о производу
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.prompt=Користите %s као повратну информацију о производу. Идентификујте да ли указује на квалитет, потражњу, продају или подршку и предложите активности за праћење.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.title=Продајни сигнал
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.prompt=Проверите да ли %s садржи користан сигнал за продају или управљање налогом. Повежите га са контекстом производа и могућим утицајем на клијента.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.title=Праћење подршке
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.prompt=Направите план праћења подршке за %s. Укључите ко треба да одговори, шта треба разјаснити и који CRM контекст је важан.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.singular=овог корисника
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.plural=ове кориснике
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.title=Преглед оптерећења
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.prompt=Анализирајте CRM контекст за %s. Сажмите клијенте у надлежности, задатке, недавну активност и области којима је можда потребна пажња менаџмента.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.title=Фокус налога
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.prompt=Идентификујте на шта %s треба следеће да се фокусира. Поређајте по приоритету клијенте, поруџбине, фактуре или задатке који делују најважније.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.title=Примопредаја ризика
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.prompt=Направите примопредају ризика за %s. Истакните отворен рад, ризичне клијенте, доспеле финансијске теме и одговорности за праћење.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.title=Резиме активности
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.prompt=Сажмите недавну CRM активност око %s и објасните шта она значи за продају, финансије или операције.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.singular=овај изабрани контекст
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.plural=ове изабране записе
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.title=Преглед контекста
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.prompt=Анализирајте %s заједно. Објасните шта сваки запис представља, како су повезани и коју пословну ситуацију описују.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.2.title=Ризици и празнине
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.2.prompt=Прегледајте %s ради ризика, недостајућих информација, закаснелог рада или неусаглашених података. Поређајте по приоритету проблеме којима треба пажња.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.3.title=Следеће активности
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.3.prompt=Изведите најкорисније следеће активности из %s. Дајте ми приоритетну листу са кратким образложењем и јасним власницима где је могуће.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.4.title=Пословни резиме
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.4.prompt=Направите компактни менаџерски резиме за %s. Фокусирајте се на финансијски статус, оперативно стање, утицај на клијента и потребе за праћењем.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.target.singular=овај запис
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.target.plural=ове записе
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.1.title=Резиме записа
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.1.prompt=Сажмите %s пословним језиком. Укључите најважнија поља, повезане записе и зашто је то важно.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.2.title=Преглед ризика
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.2.prompt=Прегледајте %s ради видљивих ризика, блокада, недостајућих информација или потреба за праћењем. Поређајте налазе по приоритету.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.3.title=Повезани контекст
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.3.prompt=Објасните како се %s повезује са другим CRM подацима као што су клијенти, поруџбине, фактуре, уплате, производи или задаци.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.4.title=Следеће активности
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.4.prompt=Предложите практичне следеће активности за %s. Нека листа буде приоритетна и објасните разлог за сваку активност.

