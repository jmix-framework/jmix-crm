com.company.crm.ai.view.conversation/promptSuggestion.1.title=Klijenti sa najvećim rizikom
com.company.crm.ai.view.conversation/promptSuggestion.1.prompt=Proverite Connelly LLC, Kulas-Luettgen, King-Adams, Zulauf, Kihn and Lakin i Strosin Inc na signale rizika na osnovu otvorenih faktura, dospelih uplata ili neobične nedavne aktivnosti. Koristite dostupne CRM podatke, izvršite JPQL upite ako je potrebno i kratko objasnite kojih pet klijenata je trenutno najkritičnije i zašto.
com.company.crm.ai.view.conversation/promptSuggestion.2.title=Najvažnije dospele fakture
com.company.crm.ai.view.conversation/promptSuggestion.2.prompt=Prikažite mi pet najvažnijih dospelih faktura sa klijentom, iznosom, datumom dospeća i statusom. Poređajte ih po poslovnom riziku i objasnite koje slučajeve treba prvo da pregledam.
com.company.crm.ai.view.conversation/promptSuggestion.3.title=Prioriteti prodajnog procesa
com.company.crm.ai.view.conversation/promptSuggestion.3.prompt=Analizirajte trenutni prodajni proces i recite mi koji poslovi sada zahtevaju najviše pažnje. Uzmite u obzir obim, status i moguće signale rizika i pretvorite rezultat u kratak menadžerski rezime.
com.company.crm.ai.view.conversation/promptSuggestion.4.title=Pregled Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.4.prompt=Napravite kompaktni pregled klijenta Connelly LLC iz svih uglova za pripremu sastanka sa klijentom. Sažmite prihod, otvorene fakture, ponašanje pri plaćanju, nedavne aktivnosti i vidljive rizike u jasan menadžerski brifing.
com.company.crm.ai.view.conversation/promptSuggestion.5.title=Pregled porudžbina Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.5.prompt=Prikažite mi najvrednije ili najneobičnije porudžbine za klijenta Connelly LLC i objasnite zašto su važne iz poslovne perspektive. Koristite dostupne podatke i istaknite otvorena pitanja, rizike ili aktivnosti za praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.6.title=Lanac fakture Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.6.prompt=Objasnite na jednom konkretnom primeru za klijenta Connelly LLC kako su faktura, porudžbina, uplata i klijent povezani u poslovnom toku. Ako je relevantno više zapisa, pretvorite ih u jednu jasnu poslovnu priču sa ključnim ID-jevima ili nazivima.
com.company.crm.ai.view.conversation/promptSuggestion.7.title=Analiza obrazaca plaćanja
com.company.crm.ai.view.conversation/promptSuggestion.7.prompt=Proverite da li trenutno postoje neobični obrasci plaćanja, opomena ili kašnjenja. Prikažite konkretne primere i izvedite zaključak gde finansije ili menadžeri naloga treba da reaguju.
com.company.crm.ai.view.conversation/promptSuggestion.8.title=Predstavi proizvod
com.company.crm.ai.view.conversation/promptSuggestion.8.prompt=Napravite kratak i ubedljiv prodajni rezime za jedan izabrani proizvod poslovnim jezikom. Opišite vrednost, verovatne slučajeve upotrebe i šta prodavac treba da naglasi u razgovoru.
com.company.crm.ai.view.conversation/promptSuggestion.9.title=Sledeći koraci za Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.9.prompt=Izvedite najkorisnije sledeće korake za prodaju i finansije za klijenta Connelly LLC iz trenutnih CRM podataka. Dajte mi prioritetnu listu sa kratkim obrazloženjem kako bih mogao odmah da postupim.
com.company.crm.ai.view.conversation/promptSuggestion.10.title=Izveštaj o riziku novčanog toka
com.company.crm.ai.view.conversation/promptSuggestion.10.prompt=Analizirajte novčani tok i raspodelu rizika po dostupnim kategorijama proizvoda ili usluga i objasnite najvažnije nalaze. Istaknite kategorije sa visokim rizikom ili neobičnom raspodelom i navedite koje aktivnosti treba da uslede.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.singular=ovog klijenta
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.plural=ove klijente
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.title=Provera stanja klijenta
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.prompt=Analizirajte %s koristeći CRM kontekst. Sažmite prihod, otvorene fakture, ponašanje pri plaćanju, nedavne porudžbine, vidljive rizike i sledeće aktivnosti za upravljanje nalogom.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.title=Rizik plaćanja
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.prompt=Pregledajte rizik plaćanja i faktura za %s. Istaknite dospele iznose, neplaćena salda, neobično ponašanje pri plaćanju i koje finansijske aktivnosti treba prvo sprovesti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.title=Spremnost porudžbina
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.prompt=Pregledajte situaciju sa porudžbinama za %s. Identifikujte važne porudžbine, otvorene rizike isporuke ili ispunjenja, povezane fakture i preporučene operativne aktivnosti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.title=Brifing za sastanak
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.prompt=Napravite sažet brifing za sastanak za %s. Uključite poslovni odnos, nedavnu aktivnost, finansijski status, verovatne teme razgovora i konkretne sledeće korake.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.singular=ovu porudžbinu
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.plural=ove porudžbine
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.title=Pregled statusa porudžbine
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.prompt=Pregledajte %s u kontekstu. Sažmite status, ukupnu vrednost, ključne stavke, uticaj na klijenta i rizike ili blokade kojima treba posvetiti pažnju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.title=Uticaj na fakture
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.prompt=Proverite kako se %s povezuje sa fakturama i uplatama. Objasnite šta je fakturisano, šta je ostalo otvoreno i da li finansije treba da reaguju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.title=Praćenje sa klijentom
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.prompt=Pripremite rezime za praćenje sa klijentom za %s. Uključite trenutni status, važne stavke, otvorena pitanja i najbolju sledeću aktivnost.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.title=Miks proizvoda
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.prompt=Analizirajte miks proizvoda ili kategorija u %s. Istaknite najvažnije stavke, neobične količine ili vrednosti i prodajne prilike.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.singular=ovu fakturu
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.plural=ove fakture
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.title=Pregled fakture
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.prompt=Pregledajte %s i sažmite status, datum dospeća, ukupan iznos, povezanu porudžbinu, primljene uplate i preostali saldo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.title=Rizik naplate
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.prompt=Procenite rizik naplate za %s. Istaknite dospele ili neplaćene iznose, verovatne uzroke i koju aktivnost treba prvo sprovesti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.title=Poslovni lanac
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.prompt=Objasnite poslovni lanac oko %s: klijent, porudžbina, faktura, uplate i sva otvorena operativna ili finansijska pitanja.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.title=Finansijski plan aktivnosti
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.prompt=Napravite prioritetni finansijski plan aktivnosti za %s. Uključite šta treba proveriti, koga treba kontaktirati i koji ishod treba postići.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.singular=ovu uplatu
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.plural=ove uplate
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.title=Raspodela uplate
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.prompt=Pregledajte %s i objasnite kojoj fakturi, porudžbini i klijentu pripada. Sažmite iznos, datum i eventualni preostali saldo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.title=Uticaj na novčani tok
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.prompt=Analizirajte uticaj %s na novčani tok. Objasnite šta ova uplata menja u saldu klijenta i da li su preostale finansijske aktivnosti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.title=Ponašanje pri plaćanju
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.prompt=Koristite %s za procenu ponašanja povezanog klijenta pri plaćanju. Istaknite pravovremenost, otvorene fakture, signale rizika i sledeće aktivnosti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.title=Provera usaglašavanja
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.prompt=Proverite da li %s odgovara povezanoj fakturi i porudžbini. Istaknite neslaganja, nedostajuće podatke ili potrebu za praćenjem.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.singular=ovaj proizvod
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.plural=ove proizvode
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.title=Rezime proizvoda
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.prompt=Napravite poslovni rezime za %s. Objasnite šta je to, kako se koristi u porudžbinama i šta prodavac treba da zna.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.title=Prodajne prilike
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.prompt=Analizirajte prodajne prilike oko %s. Identifikujte relevantne klijente, nedavne porudžbine i korisne sledeće aktivnosti za prodaju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.title=Istorija porudžbina
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.prompt=Pregledajte istoriju porudžbina za %s. Istaknite važne porudžbine, neobične obrasce potražnje i rizike ili aktivnosti za praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.title=Kontekst kategorije
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.prompt=Objasnite kako se %s uklapa u svoju kategoriju i gde stvara poslovnu vrednost. Navedite srodne proizvode ili segmente klijenata ako su vidljivi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.singular=ovu kategoriju
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.plural=ove kategorije
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.title=Pregled kategorije
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.prompt=Analizirajte %s kao poslovnu kategoriju. Sažmite povezane proizvode, aktivnost porudžbina, značaj za prihod i vidljive rizike.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.title=Rizik novčanog toka
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.prompt=Pregledajte signale novčanog toka i rizika za %s. Istaknite važne proizvode, klijente ili fakture koji zaslužuju pažnju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.title=Fokus prodaje
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.prompt=Predložite gde prodaja treba da se fokusira u okviru %s. Identifikujte perspektivne proizvode, aktivne klijente i sledeće aktivnosti.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.title=Sređivanje portfolija
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.prompt=Proverite %s za nedovoljno korišćene, neobične ili visokorizične proizvode. Preporučite sređivanje, praćenje ili izveštavanje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.singular=ovaj zadatak
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.plural=ove zadatke
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.title=Brifing zadatka
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.prompt=Napravite sažet brifing za %s. Sažmite svrhu, hitnost, povezane CRM zapise, kontekst vlasnika i očekivanu sledeću aktivnost.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.title=Plan aktivnosti
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.prompt=Pretvorite %s u praktičan plan aktivnosti. Navedite sledeće korake, zavisnosti, rizike i šta treba prvo uraditi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.title=Blokiran rad
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.prompt=Proverite da li %s deluje blokirano ili rizično. Identifikujte nedostajuće informacije, povezane klijente ili dokumente i potrebe za eskalacijom.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.title=Uticaj na klijenta
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.prompt=Objasnite uticaj %s na klijenta ili poslovanje. Istaknite zašto je važno i kako završetak menja CRM situaciju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.singular=ovaj kontakt
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.plural=ove kontakte
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.title=Brifing kontakta
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.prompt=Napravite CRM brifing za %s. Sažmite ulogu, povezanog klijenta, značaj komunikacije, otvorene teme i korisne sledeće korake.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.title=Odnos sa klijentom
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.prompt=Analizirajte kako se %s uklapa u odnos sa povezanim klijentom. Istaknite uticaj na odlučivanje, nedavni kontekst, rizike i aktivnosti upravljanja nalogom.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.title=Priprema sastanka
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.prompt=Pripremite razgovor sa %s. Uključite verovatne teme, relevantne podatke o klijentu, otvorene fakture ili porudžbine i pitanja za praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.title=Ideje za praćenje
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.prompt=Predložite korisne aktivnosti praćenja za %s na osnovu povezanog CRM konteksta. Poređajte aktivnosti po prioritetu za prodaju, finansije ili podršku.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.singular=ovu stavku porudžbine
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.plural=ove stavke porudžbine
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.title=Pregled stavke
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.prompt=Pregledajte %s u kontekstu porudžbine. Objasnite proizvod, količinu, vrednost, značaj za klijenta i rizike ispunjenja ili cene.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.title=Potražnja za proizvodom
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.prompt=Koristite %s za procenu potražnje za proizvodom i prodajnog značaja. Navedite povezanu kategoriju, vrednost porudžbine i moguće prilike za dodatnu prodaju ili praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.title=Uticaj na porudžbinu
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.prompt=Objasnite kako %s utiče na povezanu porudžbinu i situaciju klijenta. Istaknite zavisnosti, uticaj na fakturu i operativne sledeće korake.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.title=Provera rizika
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.prompt=Proverite %s za neobičnu količinu, cenu, proizvod ili signale ispunjenja. Recite mi šta treba proveriti pre praćenja.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.singular=ovaj komentar proizvoda
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.plural=ove komentare proizvoda
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.title=Rezime komentara
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.prompt=Sažmite %s poslovnim jezikom. Objasnite povezani proizvod, kontekst pošiljaoca, problem ili signal i šta treba da se desi sledeće.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.title=Povratne informacije o proizvodu
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.prompt=Koristite %s kao povratnu informaciju o proizvodu. Identifikujte da li ukazuje na kvalitet, potražnju, prodaju ili podršku i predložite aktivnosti za praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.title=Prodajni signal
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.prompt=Proverite da li %s sadrži koristan signal za prodaju ili upravljanje nalogom. Povežite ga sa kontekstom proizvoda i mogućim uticajem na klijenta.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.title=Praćenje podrške
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.prompt=Napravite plan praćenja podrške za %s. Uključite ko treba da odgovori, šta treba razjasniti i koji CRM kontekst je važan.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.singular=ovog korisnika
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.plural=ove korisnike
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.title=Pregled opterećenja
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.prompt=Analizirajte CRM kontekst za %s. Sažmite klijente u nadležnosti, zadatke, nedavnu aktivnost i oblasti kojima je možda potrebna pažnja menadžmenta.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.title=Fokus naloga
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.prompt=Identifikujte na šta %s treba sledeće da se fokusira. Poređajte po prioritetu klijente, porudžbine, fakture ili zadatke koji deluju najvažnije.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.title=Primopredaja rizika
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.prompt=Napravite primopredaju rizika za %s. Istaknite otvoren rad, rizične klijente, dospele finansijske teme i odgovornosti za praćenje.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.title=Rezime aktivnosti
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.prompt=Sažmite nedavnu CRM aktivnost oko %s i objasnite šta ona znači za prodaju, finansije ili operacije.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.singular=ovaj izabrani kontekst
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.plural=ove izabrane zapise
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.title=Pregled konteksta
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.prompt=Analizirajte %s zajedno. Objasnite šta svaki zapis predstavlja, kako su povezani i koju poslovnu situaciju opisuju.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.2.title=Rizici i praznine
