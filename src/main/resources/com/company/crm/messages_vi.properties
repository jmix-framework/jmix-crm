com.company.crm.ai.view.conversation/promptSuggestion.1.title=Khách hàng rủi ro cao nhất
com.company.crm.ai.view.conversation/promptSuggestion.1.prompt=Rà soát Connelly LLC, Kulas-Luettgen, King-Adams, Zulauf, Kihn and Lakin và Strosin Inc để tìm tín hiệu rủi ro dựa trên hóa đơn mở, thanh toán quá hạn hoặc hoạt động gần đây bất thường. Sử dụng dữ liệu CRM có sẵn, chạy truy vấn JPQL nếu cần và giải thích ngắn gọn năm khách hàng nào hiện quan trọng nhất và vì sao.
com.company.crm.ai.view.conversation/promptSuggestion.2.title=Hóa đơn quá hạn quan trọng nhất
com.company.crm.ai.view.conversation/promptSuggestion.2.prompt=Hiển thị cho tôi năm hóa đơn quá hạn quan trọng nhất với khách hàng, số tiền, hạn thanh toán và trạng thái. Ưu tiên theo rủi ro kinh doanh và giải thích trường hợp nào tôi nên xem trước.
com.company.crm.ai.view.conversation/promptSuggestion.3.title=Ưu tiên pipeline
com.company.crm.ai.view.conversation/promptSuggestion.3.prompt=Phân tích pipeline bán hàng hiện tại và cho tôi biết thương vụ nào cần được chú ý nhất ngay bây giờ. Xem xét quy mô, trạng thái và các tín hiệu rủi ro có thể có, rồi chuyển kết quả thành một bản tóm tắt quản lý ngắn.
com.company.crm.ai.view.conversation/promptSuggestion.4.title=Tổng quan Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.4.prompt=Tạo chế độ xem khách hàng 360 độ ngắn gọn cho Connelly LLC để chuẩn bị cho cuộc họp với khách hàng. Tóm tắt doanh thu, hóa đơn mở, hành vi thanh toán, hoạt động gần đây và rủi ro thấy được trong một bản briefing quản lý rõ ràng.
com.company.crm.ai.view.conversation/promptSuggestion.5.title=Rà soát đơn hàng Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.5.prompt=Hiển thị cho tôi các đơn hàng có giá trị cao nhất hoặc bất thường nhất liên quan đến Connelly LLC và giải thích vì sao chúng quan trọng từ góc nhìn kinh doanh. Sử dụng dữ liệu có sẵn và chỉ ra vấn đề mở, rủi ro hoặc hành động theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.6.title=Chuỗi hóa đơn Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.6.prompt=Giải thích bằng một ví dụ cụ thể cho Connelly LLC về cách hóa đơn, đơn hàng, thanh toán và khách hàng liên quan với nhau trong luồng kinh doanh. Nếu có nhiều bản ghi liên quan, hãy biến chúng thành một câu chuyện kinh doanh rõ ràng với ID hoặc tên chính.
com.company.crm.ai.view.conversation/promptSuggestion.7.title=Phân tích mẫu thanh toán
com.company.crm.ai.view.conversation/promptSuggestion.7.prompt=Kiểm tra hiện có mẫu thanh toán, nhắc nợ hoặc chậm trễ bất thường nào không. Hiển thị ví dụ cụ thể và suy ra nơi tài chính hoặc quản lý tài khoản nên hành động.
com.company.crm.ai.view.conversation/promptSuggestion.8.title=Giới thiệu sản phẩm
com.company.crm.ai.view.conversation/promptSuggestion.8.prompt=Tạo một bản tóm tắt bán hàng ngắn gọn và thuyết phục cho một sản phẩm được chọn bằng ngôn ngữ kinh doanh. Mô tả giá trị, trường hợp sử dụng có thể có và điều nhân viên bán hàng nên nhấn mạnh trong cuộc trò chuyện.
com.company.crm.ai.view.conversation/promptSuggestion.9.title=Hành động tiếp theo cho Connelly LLC
com.company.crm.ai.view.conversation/promptSuggestion.9.prompt=Suy ra các hành động tiếp theo hữu ích nhất cho bán hàng và tài chính đối với Connelly LLC từ dữ liệu CRM hiện tại. Đưa cho tôi danh sách ưu tiên với lý do ngắn để tôi có thể hành động ngay.
com.company.crm.ai.view.conversation/promptSuggestion.10.title=Báo cáo rủi ro dòng tiền
com.company.crm.ai.view.conversation/promptSuggestion.10.prompt=Phân tích dòng tiền và phân bổ rủi ro trên các danh mục sản phẩm hoặc dịch vụ có sẵn và giải thích các phát hiện quan trọng nhất. Nhấn mạnh các danh mục có rủi ro cao hoặc phân bổ bất thường và cho biết hành động tiếp theo nên là gì.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.singular=khách hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.target.plural=những khách hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.title=Kiểm tra sức khỏe khách hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.1.prompt=Phân tích %s bằng ngữ cảnh CRM. Tóm tắt doanh thu, hóa đơn mở, hành vi thanh toán, đơn hàng gần đây, rủi ro thấy được và hành động tiếp theo cho quản lý tài khoản.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.title=Rủi ro thanh toán
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.2.prompt=Rà soát rủi ro thanh toán và hóa đơn cho %s. Nhấn mạnh số tiền quá hạn, số dư chưa thanh toán, hành vi thanh toán bất thường và hành động theo dõi tài chính nào nên diễn ra trước.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.title=Mức sẵn sàng đơn hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.3.prompt=Rà soát tình hình đơn hàng cho %s. Xác định các đơn hàng quan trọng, rủi ro giao hàng hoặc thực hiện còn mở, hóa đơn liên quan và hành động vận hành được khuyến nghị.
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.title=Brief họp
com.company.crm.ai.view.conversation/promptSuggestion.entity.client.4.prompt=Tạo brief họp ngắn gọn cho %s. Bao gồm quan hệ kinh doanh, hoạt động gần đây, trạng thái tài chính, chủ đề trao đổi có khả năng xảy ra và bước tiếp theo cụ thể.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.singular=đơn hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.target.plural=những đơn hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.title=Rà soát trạng thái đơn hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.1.prompt=Rà soát %s trong ngữ cảnh. Tóm tắt trạng thái, tổng giá trị, mặt hàng chính, tác động tới khách hàng và mọi rủi ro hoặc điểm nghẽn cần chú ý.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.title=Tác động hóa đơn
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.2.prompt=Kiểm tra cách %s liên kết với hóa đơn và thanh toán. Giải thích phần nào đã được xuất hóa đơn, phần nào còn mở và liệu tài chính có nên theo dõi không.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.title=Theo dõi khách hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.3.prompt=Chuẩn bị bản tóm tắt theo dõi hướng tới khách hàng cho %s. Bao gồm trạng thái hiện tại, mặt hàng quan trọng, câu hỏi mở và hành động tốt nhất tiếp theo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.title=Cơ cấu sản phẩm
com.company.crm.ai.view.conversation/promptSuggestion.entity.order.4.prompt=Phân tích cơ cấu sản phẩm hoặc danh mục trong %s. Chỉ ra các mặt hàng quan trọng nhất, số lượng hoặc giá trị bất thường và cơ hội bán hàng.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.singular=hóa đơn này
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.target.plural=những hóa đơn này
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.title=Rà soát hóa đơn
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.1.prompt=Rà soát %s và tóm tắt trạng thái, hạn thanh toán, tổng số tiền, đơn hàng liên quan, thanh toán đã nhận và số dư còn lại.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.title=Rủi ro thu tiền
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.2.prompt=Đánh giá rủi ro thu tiền cho %s. Nhấn mạnh số tiền quá hạn hoặc chưa thanh toán, nguyên nhân có thể có và hành động theo dõi nào nên diễn ra trước.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.title=Chuỗi kinh doanh
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.3.prompt=Giải thích chuỗi kinh doanh xung quanh %s: khách hàng, đơn hàng, hóa đơn, thanh toán và mọi vấn đề vận hành hoặc tài chính còn mở.
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.title=Kế hoạch hành động tài chính
com.company.crm.ai.view.conversation/promptSuggestion.entity.invoice.4.prompt=Tạo kế hoạch hành động tài chính có ưu tiên cho %s. Bao gồm điều cần kiểm tra, người cần liên hệ và kết quả cần hướng tới.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.singular=thanh toán này
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.target.plural=những thanh toán này
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.title=Phân bổ thanh toán
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.1.prompt=Rà soát %s và giải thích nó thuộc về hóa đơn, đơn hàng và khách hàng nào. Tóm tắt số tiền, ngày và mọi số dư còn lại.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.title=Tác động dòng tiền
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.2.prompt=Phân tích tác động dòng tiền của %s. Giải thích thanh toán này thay đổi gì trong số dư khách hàng và liệu còn hành động tài chính nào không.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.title=Hành vi thanh toán
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.3.prompt=Sử dụng %s để đánh giá hành vi thanh toán của khách hàng liên quan. Nhấn mạnh tính đúng hạn, hóa đơn mở, tín hiệu rủi ro và hành động tiếp theo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.title=Kiểm tra đối soát
com.company.crm.ai.view.conversation/promptSuggestion.entity.payment.4.prompt=Kiểm tra liệu %s có nhất quán với hóa đơn và đơn hàng liên quan không. Chỉ ra sai lệch, dữ liệu thiếu hoặc nhu cầu theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.singular=sản phẩm này
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.target.plural=những sản phẩm này
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.title=Tóm tắt sản phẩm
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.1.prompt=Tạo bản tóm tắt kinh doanh cho %s. Giải thích đó là gì, được sử dụng trong đơn hàng như thế nào và nhân viên bán hàng nên biết gì.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.title=Cơ hội bán hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.2.prompt=Phân tích cơ hội bán hàng xung quanh %s. Xác định khách hàng liên quan, đơn hàng gần đây và hành động tiếp theo hữu ích cho bán hàng.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.title=Lịch sử đơn hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.3.prompt=Rà soát lịch sử đơn hàng cho %s. Nhấn mạnh đơn hàng quan trọng, mẫu nhu cầu bất thường và mọi rủi ro hoặc theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.title=Ngữ cảnh danh mục
com.company.crm.ai.view.conversation/promptSuggestion.entity.product.4.prompt=Giải thích cách %s phù hợp với danh mục của nó và nơi nó tạo ra giá trị kinh doanh. Nhắc đến sản phẩm liên quan hoặc phân khúc khách hàng nếu thấy được.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.singular=danh mục này
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.target.plural=những danh mục này
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.title=Tổng quan danh mục
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.1.prompt=Phân tích %s như một danh mục kinh doanh. Tóm tắt sản phẩm liên quan, hoạt động đơn hàng, mức liên quan tới doanh thu và rủi ro thấy được.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.title=Rủi ro dòng tiền
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.2.prompt=Rà soát tín hiệu dòng tiền và rủi ro cho %s. Nhấn mạnh sản phẩm, khách hàng hoặc hóa đơn quan trọng đáng chú ý.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.title=Trọng tâm bán hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.3.prompt=Đề xuất nơi bán hàng nên tập trung trong %s. Xác định sản phẩm tiềm năng, khách hàng đang hoạt động và hành động tiếp theo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.title=Dọn dẹp danh mục
com.company.crm.ai.view.conversation/promptSuggestion.entity.category.4.prompt=Kiểm tra %s để tìm sản phẩm ít dùng, bất thường hoặc rủi ro cao. Khuyến nghị dọn dẹp, theo dõi hoặc hành động báo cáo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.singular=nhiệm vụ này
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.target.plural=những nhiệm vụ này
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.title=Brief nhiệm vụ
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.1.prompt=Tạo brief ngắn gọn cho %s. Tóm tắt mục đích, mức khẩn cấp, bản ghi CRM liên quan, ngữ cảnh chủ sở hữu và hành động tiếp theo được mong đợi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.title=Kế hoạch hành động
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.2.prompt=Biến %s thành kế hoạch hành động thực tế. Liệt kê bước tiếp theo, phụ thuộc, rủi ro và điều nên làm trước.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.title=Công việc bị chặn
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.3.prompt=Kiểm tra liệu %s có vẻ bị chặn hoặc rủi ro không. Xác định thông tin thiếu, khách hàng hoặc tài liệu liên quan và nhu cầu leo thang.
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.title=Tác động tới khách hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.task.4.prompt=Giải thích tác động của %s tới khách hàng hoặc kinh doanh. Nhấn mạnh vì sao nó quan trọng và việc hoàn thành thay đổi tình hình CRM như thế nào.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.singular=liên hệ này
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.target.plural=những liên hệ này
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.title=Brief liên hệ
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.1.prompt=Tạo brief CRM cho %s. Tóm tắt vai trò, khách hàng liên quan, mức liên quan về giao tiếp, chủ đề mở và bước tiếp theo hữu ích.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.title=Quan hệ khách hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.2.prompt=Phân tích cách %s phù hợp với quan hệ khách hàng liên quan. Nhấn mạnh ảnh hưởng ra quyết định, ngữ cảnh gần đây, rủi ro và hành động quản lý tài khoản.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.title=Chuẩn bị cuộc họp
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.3.prompt=Chuẩn bị cho cuộc trò chuyện với %s. Bao gồm chủ đề trao đổi có thể có, dữ liệu khách hàng liên quan, hóa đơn hoặc đơn hàng mở và câu hỏi theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.title=Ý tưởng theo dõi
com.company.crm.ai.view.conversation/promptSuggestion.entity.contact.4.prompt=Đề xuất hành động theo dõi hữu ích cho %s dựa trên ngữ cảnh CRM liên quan. Ưu tiên hành động cho bán hàng, tài chính hoặc hỗ trợ.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.singular=mặt hàng đơn hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.target.plural=những mặt hàng đơn hàng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.title=Rà soát mặt hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.1.prompt=Rà soát %s trong ngữ cảnh đơn hàng của nó. Giải thích sản phẩm, số lượng, giá trị, mức liên quan tới khách hàng và mọi rủi ro thực hiện hoặc giá.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.title=Nhu cầu sản phẩm
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.2.prompt=Sử dụng %s để đánh giá nhu cầu sản phẩm và mức liên quan bán hàng. Nhắc đến danh mục liên quan, giá trị đơn hàng và cơ hội bán thêm hoặc theo dõi có thể có.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.title=Tác động đơn hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.3.prompt=Giải thích cách %s ảnh hưởng đến đơn hàng liên quan và tình hình khách hàng. Nhấn mạnh phụ thuộc, tác động hóa đơn và bước tiếp theo về vận hành.
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.title=Kiểm tra rủi ro
com.company.crm.ai.view.conversation/promptSuggestion.entity.orderItem.4.prompt=Kiểm tra %s để tìm tín hiệu bất thường về số lượng, giá, sản phẩm hoặc thực hiện. Cho tôi biết điều gì nên được xác minh trước khi theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.singular=bình luận sản phẩm này
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.target.plural=những bình luận sản phẩm này
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.title=Tóm tắt bình luận
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.1.prompt=Tóm tắt %s bằng ngôn ngữ kinh doanh. Giải thích sản phẩm liên quan, ngữ cảnh người gửi, vấn đề hoặc tín hiệu và điều nên xảy ra tiếp theo.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.title=Phản hồi sản phẩm
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.2.prompt=Sử dụng %s như phản hồi sản phẩm. Xác định liệu nó chỉ ra chủ đề chất lượng, nhu cầu, bán hàng hay hỗ trợ và đề xuất hành động theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.title=Tín hiệu bán hàng
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.3.prompt=Kiểm tra liệu %s có chứa tín hiệu hữu ích cho bán hàng hoặc quản lý tài khoản không. Liên hệ nó với ngữ cảnh sản phẩm và tác động khách hàng có thể có.
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.title=Theo dõi hỗ trợ
com.company.crm.ai.view.conversation/promptSuggestion.entity.productComment.4.prompt=Tạo kế hoạch theo dõi hỗ trợ cho %s. Bao gồm ai nên phản hồi, cần làm rõ điều gì và ngữ cảnh CRM nào quan trọng.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.singular=người dùng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.target.plural=những người dùng này
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.title=Tổng quan khối lượng công việc
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.1.prompt=Phân tích ngữ cảnh CRM cho %s. Tóm tắt khách hàng phụ trách, nhiệm vụ, hoạt động gần đây và khu vực có thể cần quản lý chú ý.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.title=Trọng tâm tài khoản
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.2.prompt=Xác định %s nên tập trung vào đâu tiếp theo. Ưu tiên khách hàng, đơn hàng, hóa đơn hoặc nhiệm vụ có vẻ quan trọng nhất.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.title=Bàn giao rủi ro
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.3.prompt=Tạo bản bàn giao rủi ro cho %s. Nhấn mạnh công việc mở, khách hàng rủi ro, chủ đề tài chính quá hạn và trách nhiệm theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.title=Tóm tắt hoạt động
com.company.crm.ai.view.conversation/promptSuggestion.entity.user.4.prompt=Tóm tắt hoạt động CRM gần đây xung quanh %s và giải thích ý nghĩa của nó đối với bán hàng, tài chính hoặc vận hành.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.singular=ngữ cảnh đã chọn này
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.target.plural=những bản ghi đã chọn này
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.title=Tổng quan ngữ cảnh
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.1.prompt=Phân tích %s cùng nhau. Giải thích mỗi bản ghi đại diện cho điều gì, chúng liên quan với nhau như thế nào và mô tả tình huống kinh doanh nào.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.2.title=Rủi ro và khoảng trống
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.2.prompt=Rà soát %s để tìm rủi ro, thông tin thiếu, công việc quá hạn hoặc dữ liệu không nhất quán. Ưu tiên các vấn đề cần chú ý.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.3.title=Hành động tiếp theo
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.3.prompt=Suy ra hành động tiếp theo hữu ích nhất từ %s. Đưa cho tôi danh sách ưu tiên với lý do ngắn và chủ sở hữu rõ ràng nếu có thể.
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.4.title=Tóm tắt kinh doanh
com.company.crm.ai.view.conversation/promptSuggestion.entity.mixed.4.prompt=Tạo bản tóm tắt quản lý ngắn gọn cho %s. Tập trung vào trạng thái tài chính, tình hình vận hành, tác động khách hàng và nhu cầu theo dõi.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.target.singular=bản ghi này
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.target.plural=những bản ghi này
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.1.title=Tóm tắt bản ghi
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.1.prompt=Tóm tắt %s bằng ngôn ngữ kinh doanh. Bao gồm các trường quan trọng nhất, bản ghi liên quan và vì sao điều này quan trọng.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.2.title=Rà soát rủi ro
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.2.prompt=Rà soát %s để tìm rủi ro thấy được, điểm nghẽn, thông tin thiếu hoặc nhu cầu theo dõi. Ưu tiên các phát hiện.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.3.title=Ngữ cảnh liên quan
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.3.prompt=Giải thích cách %s liên quan đến dữ liệu CRM khác như khách hàng, đơn hàng, hóa đơn, thanh toán, sản phẩm hoặc nhiệm vụ.
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.4.title=Hành động tiếp theo
com.company.crm.ai.view.conversation/promptSuggestion.entity.generic.4.prompt=Đề xuất hành động tiếp theo thực tế cho %s. Giữ danh sách theo thứ tự ưu tiên và giải thích lý do cho từng hành động.

