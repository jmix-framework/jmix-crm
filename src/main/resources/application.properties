# server
server.port=${CRM_SERVER_PORT:8080}
server.servlet.context-path=/b2b-crm

# spring
spring.profiles.active=${CRM_ACTIVE_PROFILE:local}
spring.main.allow-bean-definition-overriding=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# datasource
main.datasource.url=jdbc:hsqldb:file:.jmix/hsqldb/b2b-crm
main.datasource.username=sa
main.datasource.password=

# liquibase
main.liquibase.change-log=com/company/crm/liquibase/changelog.xml

# jmix
jmix.core.available-locales=en,de,ru,it,es,vi,sr
jmix.ui.login-view-id=LoginView
jmix.ui.main-view-id=MainView
jmix.ui.default-view-id=HomeView
jmix.ui.menu-config=com/company/crm/menu.xml
jmix.ui.composite-menu=false
jmix.ui.component.checkbox-required-state-initialization-enabled=false
jmix.core.default-file-storage=crm

# crm
crm.generateDemoData=true
ui.login.defaultUsername=admin
ui.login.defaultPassword=admin

# ai
spring.ai.model.chat=openai
spring.ai.openai.api-key=${SPRING_AI_OPENAI_APIKEY:<YOUR_API_KEY>}
spring.ai.openai.chat.options.model=gpt-5.4
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-completion-tokens=4096
# optional lightweight model for small AI tasks such as conversation titles and prompt suggestions
crm.ai.small-model.model-id=gpt-5.4-nano

# Dynamic Model agent (independent of the CRM business-data assistant)
crm.dynmodel.model=${DYNMODEL_MODEL:deepseek/deepseek-v4.1-flash}
crm.dynmodel.base-url=${DYNMODEL_BASE_URL:https://openrouter.ai/api/v1}
crm.dynmodel.api-key=${OPENROUTER_API_KEY:setup-required}
crm.dynmodel.max-output-tokens=4096
embabel.models.default-llm=${crm.dynmodel.model}
embabel.agent.platform.llm-operations.data-binding.max-attempts=1
jmix.dynmodel.ai.native-structured-output=true
jmix.dynmodel.ai.plan-approval-mode=MANUAL
jmix.dynmodel.ai.turn-timeout=4m
jmix.dynmodel.ai.max-plan-steps=24

# logging
# logs SQL generated by EclipseLink ORM
logging.level.eclipselink.logging.sql=info

# 'debug' or 'trace' levels help to troubleshoot security problems
logging.level.org.springframework.security=info

# logs all Jmix debug output
logging.level.io.jmix=info

# logs data store operations
logging.level.io.jmix.core.datastore=info

# logs access control constraints
logging.level.io.jmix.core.AccessLogger=warn

# 'debug' level logs atmosphere framework work
logging.level.org.atmosphere=warn

# spring ai logging
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.ai.tool.method.MethodToolCallback=WARN
logging.level.org.springframework.ai.tool.execution.DefaultToolCallResultConverter=WARN

# jmix ai logging: DEBUG writes the generated JPQL (executeQuery(jpql=...)) and the row-level
# conditions added to it (Access conditions applied) to the log, which the AI demo shows live
logging.level.io.jmix.aitools.dataload=DEBUG

# HTTP client proxy properties
crm.http.client.proxy.enabled=${HTTP_CLIENT_PROXY_ENABLED:false}
crm.http.client.proxy.type=${HTTP_CLIENT_PROXY_TYPE:SOCKS5}
crm.http.client.proxy.port=${HTTP_CLIENT_PROXY_PORT:-1}
crm.http.client.proxy.host=${HTTP_CLIENT_PROXY_HOST:}
crm.http.client.proxy.username=${HTTP_CLIENT_PROXY_USERNAME:}
crm.http.client.proxy.password=${HTTP_CLIENT_PROXY_PASSWORD:}
