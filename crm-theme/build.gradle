// JST-5452 test fixture: a reusable theme add-on.
//
// Deliberately has NO dependencies — a theme artifact is resource-only by nature.
// Its frontend resource imports a non-existent npm package and must not be copied to
// the isolated preview classpath. Studio repacks only safe static resources.
plugins {
    id 'java-library'
}

group = 'com.company.crm'
version = '1.0.0'

jar {
    archiveFileName = "crm-theme-${version}.jar"
}
