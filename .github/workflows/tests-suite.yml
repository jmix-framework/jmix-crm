name: Tests Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  id-token: write

jobs:
  tests-suite:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Running tests suite
        env:
          SPRING_AI_OPENAI_APIKEY: ${{ secrets.OPENAI_API_KEY }}
          RUN_AI_TESTS: false
        run: chmod +x ./gradlew && ./gradlew test -Pvaadin.productionMode

      - name: Display test report
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: '**/build/test-results/test/TEST-*.xml'

      - name: Archive test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests
